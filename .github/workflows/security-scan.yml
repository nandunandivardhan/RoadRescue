name: Security & Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for secret scanning

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Run Secret Scan (TruffleHog)
      uses: trufflesecurity/trufflehog-oss-action@main
      continue-on-error: true # Allow reporting without hard blocker if older history contains tokens
      with:
        args: "--fail --yes ."

    - name: Run Root Dependency Audit
      run: |
        npm audit --audit-level=high || true

    - name: Run Web App Dependency Audit
      run: |
        cd roadrescue-web
        npm audit --audit-level=high || true

    - name: ESLint Security and Code Quality Check
      run: |
        cd roadrescue-web
        npm ci
        npm run lint || true

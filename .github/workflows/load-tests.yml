name: Performance & Load Testing (k6)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  k6_load_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: roadrescue-web/package-lock.json

    - name: Install Web App dependencies
      run: |
        cd roadrescue-web
        npm ci

    - name: Build Web App
      run: |
        cd roadrescue-web
        npm run build

    - name: Start Production Vite Preview Server
      run: |
        cd roadrescue-web
        nohup npx vite preview --host 0.0.0.0 --port 4173 > vite.log 2>&1 &
        echo $! > vite.pid
        echo "Started Vite Preview server PID: $(cat vite.pid)"

    - name: Health Check - Wait for Server
      run: |
        echo "Waiting for Vite Preview server on http://127.0.0.1:4173..."
        for i in $(seq 1 30); do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173 2>/dev/null || echo "000")
          echo "Attempt $i: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Server is HEALTHY and responding with HTTP 200"
            break
          fi
          sleep 2
        done

        # Final verification
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173 2>/dev/null || echo "000")
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "ERROR: Server failed to start. HTTP status: $HTTP_STATUS"
          echo "=== Vite Server Logs ==="
          cat roadrescue-web/vite.log || true
          echo "=== Process List ==="
          ps aux | grep -i vite || true
          echo "=== Listening Ports ==="
          ss -tuln | grep 4173 || true
          exit 1
        fi

        echo "=== Server Diagnostics ==="
        ps aux | grep -i vite || true
        ss -tuln | grep 4173 || true

    - name: Install k6
      run: |
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
          --keyserver hkp://keyserver.ubuntu.com:80 \
          --recv-keys C5AD194E22C704358A1382227D680576A01E42F9
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
          | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6
        k6 version

    - name: Run k6 Load Test
      run: k6 run tests/load/k6Test.js --env TARGET_URL=http://127.0.0.1:4173

    - name: Post-Test Diagnostics
      if: always()
      run: |
        echo "=== Post-Test Server Health ==="
        curl -s -o /dev/null -w "HTTP %{http_code}" http://127.0.0.1:4173 || echo "Server unreachable"
        echo ""
        echo "=== Vite Preview Logs ==="
        cat roadrescue-web/vite.log 2>/dev/null || echo "No logs found"

    - name: Upload Load Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: k6-load-test-report
        path: k6-report.html
        if-no-files-found: warn

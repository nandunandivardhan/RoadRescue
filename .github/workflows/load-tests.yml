name: Performance & Load Testing (k6)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  k6_load_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12'
        cache: 'npm'
        cache-dependency-path: roadrescue-web/package-lock.json

    - name: Install Web App dependencies
      run: |
        cd roadrescue-web
        npm ci

    - name: Build Web App
      run: |
        cd roadrescue-web
        npm run build

    - name: Start Vite Preview Server
      run: |
        cd roadrescue-web
        nohup npx vite preview --host 0.0.0.0 --port 4173 > vite-preview.log 2>&1 &
        echo $! > vite-preview.pid
        echo "Vite Preview server started (PID: $(cat vite-preview.pid))"

    - name: Wait for Vite Preview Server
      run: |
        echo "Waiting for http://127.0.0.1:4173 ..."
        for i in $(seq 1 30); do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Server healthy (HTTP 200)"
            break
          fi
          echo "Attempt $i/30: HTTP $HTTP_STATUS"
          sleep 2
        done
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173 2>/dev/null || echo "000")
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "ERROR: Preview server failed to start (HTTP $HTTP_STATUS)"
          echo "--- vite-preview.log ---"
          cat roadrescue-web/vite-preview.log || true
          echo "--- processes ---"
          ps aux | grep -i vite || true
          echo "--- ports ---"
          ss -tuln | grep 4173 || true
          exit 1
        fi

    - name: Install k6 from official Grafana APT repository
      run: |
        sudo gpg --no-default-keyring \
          --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
          --keyserver hkp://keyserver.ubuntu.com:80 \
          --recv-keys C5AD194E22C704358A1382227D680576A01E42F9
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
          | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6
        echo "Installed k6 version: $(k6 version)"

    - name: Run k6 Load Test
      run: k6 run tests/load/k6Test.js --env TARGET_URL=http://127.0.0.1:4173

    - name: Post-test diagnostics
      if: always()
      run: |
        echo "--- Post-test server health ---"
        curl -s -o /dev/null -w "HTTP %{http_code}" http://127.0.0.1:4173 || echo "Server unreachable"
        echo ""
        echo "--- Vite Preview Logs ---"
        cat roadrescue-web/vite-preview.log 2>/dev/null || echo "(no logs)"

    - name: Upload k6 HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: k6-load-test-report
        path: k6-report.html
        if-no-files-found: warn

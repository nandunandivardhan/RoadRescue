name: Performance & Load Testing (k6)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  k6_load_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: roadrescue-web/package-lock.json

    - name: Install Web App dependencies
      run: |
        cd roadrescue-web
        npm ci

    - name: Build Web App
      run: |
        cd roadrescue-web
        npm run build

    - name: Start Production Vite Preview Server
      run: |
        cd roadrescue-web
        nohup npm run preview -- --host 0.0.0.0 --port 4173 > vite.log 2>&1 &
        echo $! > vite.pid
        echo "Started Vite Preview server process PID: $(cat vite.pid)"

    - name: Health Check & Server Diagnostics
      run: |
        echo "Waiting for Vite Preview server on http://127.0.0.1:4173..."
        npx wait-on http://127.0.0.1:4173 --timeout 60000

        echo "=== Verifying Server Response Code ==="
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173 || true)
        echo "HTTP Response Status Code: $HTTP_STATUS"

        if [ "$HTTP_STATUS" -ne 200 ]; then
          echo "ERROR: Server health check failed! Expected HTTP 200, got $HTTP_STATUS"
          echo "=== Vite Server Logs ==="
          cat roadrescue-web/vite.log || true
          exit 1
        fi

        echo "=== Active Processes & Port Listening Diagnostics ==="
        ps aux | grep vite || true
        ss -tuln | grep 4173 || netstat -tuln | grep 4173 || true
        echo "Vite Preview server is HEALTHY, responding with HTTP 200 on http://127.0.0.1:4173"

    - name: Install k6 (Official Grafana Repository)
      run: |
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD194E22C704358A1382227D680576A01E42F9
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6

    - name: Run k6 Load Test
      run: |
        k6 run tests/load/k6Test.js --env TARGET_URL=http://127.0.0.1:4173

    - name: Post-Test Server Diagnostics
      if: always()
      run: |
        echo "=== Post-Test Health Status ==="
        echo "HTTP Response Status Code: $(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173 || true)"
        echo "=== Vite Preview Logs ==="
        cat roadrescue-web/vite.log || true

    - name: Upload Load Test HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: k6-load-test-report
        path: k6-report.html

name: Live GitHub Pages E2E Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BASE_URL: https://nandunandivardhan.github.io/RoadRescue/

jobs:
  deploy_and_test:
    runs-on: ubuntu-latest

    steps:
    # Stage 1: Repository Checkout
    - name: Stage 1 - Repository Checkout
      uses: actions/checkout@v4

    # Stage 2: Dependency Installation
    - name: Stage 2 - Node.js & Dependency Installation
      uses: actions/setup-node@v4
      with:
        node-version: '22.12'

    - name: Install Web & Automation Dependencies
      run: |
        cd roadrescue-web
        npm ci || npm install
        cd ../automation
        npm ci || npm install

    # Stage 3: Build Application
    - name: Stage 3 - Build Application
      run: |
        cd roadrescue-web
        npm run build

    # Stage 4: Static Analysis
    - name: Stage 4 - Static Analysis & Linting
      run: |
        cd roadrescue-web
        npm run lint || true

    # Stage 5: Deploy to GitHub Pages
    - name: Stage 5 - Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./roadrescue-web/dist
        keep_files: true

    # Stage 6: Wait for Deployment
    - name: Stage 6 - Wait for Live Deployment
      run: |
        echo "Waiting for live deployment at $BASE_URL ..."
        for i in $(seq 1 30); do
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "307" ] || [ "$HTTP_STATUS" = "308" ]; then
            echo "Deployment reached LIVE status (HTTP $HTTP_STATUS)!"
            break
          fi
          echo "Attempt $i/30: HTTP $HTTP_STATUS - waiting for GitHub Pages..."
          sleep 4
        done

    # Stage 7: Deployment Verification
    - name: Stage 7 - Deployment Verification
      run: |
        echo "=== Verifying Live URL Status & Diagnostics ==="
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" 2>/dev/null || echo "000")
        echo "Live URL Response Status Code: $HTTP_STATUS"

        if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "301" ] && [ "$HTTP_STATUS" != "302" ] && [ "$HTTP_STATUS" != "307" ] && [ "$HTTP_STATUS" != "308" ]; then
          echo "WARNING: Live deployment returned HTTP $HTTP_STATUS (GitHub Pages propagation delay)."
          echo "Proceeding with live Selenium suite to execute validation and record diagnostics."
        else
          echo "Deployment Verification SUCCESSFUL: $BASE_URL is LIVE and responding with HTTP $HTTP_STATUS."
        fi

    # Stage 8: Run Selenium E2E Tests
    - name: Stage 8 - Run Live Selenium E2E Tests
      run: |
        cd automation
        node utils/liveSeleniumRunner.js
      env:
        BASE_URL: ${{ env.BASE_URL }}

    # Stage 9 & 10: Generate Consolidated Multi-Format Reports
    - name: Stages 9 & 10 - Verify Multi-Format & Consolidated Reports
      run: |
        echo "Generating Consolidated Excel, HTML, JSON, and Markdown reports..."
        cd automation
        node utils/consolidatedReporter.js
        cd ..
        mkdir -p "Test Results/Excel" "Test Results/HTML" "Test Results/JSON" "Test Results/Summary"
        if [ -d "automation/Test Results" ]; then
          cp -r "automation/Test Results/"* "Test Results/" || true
        fi
        ls -la "Test Results/Excel"
        ls -la "Test Results/HTML"

    # Stage 11: Upload Artifacts (30 Days Retention)
    - name: Stage 11 - Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: live-selenium-test-reports
        path: |
          Test Results/Excel/
          Test Results/HTML/
          Test Results/JSON/
          Test Results/Summary/
        retention-days: 30
        if-no-files-found: warn

    # Stage 12: Publish Summary
    - name: Stage 12 - Publish GitHub Action Summary
      if: always()
      run: |
        echo "# 🚀 Live GitHub Pages E2E Execution & Quality Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment URL**: $BASE_URL" >> $GITHUB_STEP_SUMMARY
        echo "**Execution Date**: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "**Git Commit**: \`${{ github.sha }}\` | **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "Test Results/Summary/consolidated-summary.md" ]; then
          cat "Test Results/Summary/consolidated-summary.md" >> $GITHUB_STEP_SUMMARY
        elif [ -f "Test Results/Summary/summary.md" ]; then
          cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
        fi

    # Stage 13: Store Live Web App, Android APK & Reports Payload in gh-pages
    - name: Stage 13 - Assemble Live Web App & QA Reports Payload
      if: always() && github.ref == 'refs/heads/main'
      run: |
        mkdir -p gh-pages-dist/reports/latest
        mkdir -p gh-pages-dist/reports/history/build-${{ github.run_number }}
        
        # 1. Copy Web Application dist to root
        if [ -d "roadrescue-web/dist" ]; then
          cp -r roadrescue-web/dist/* gh-pages-dist/
        fi
        
        # 2. Copy Android APK for direct browser download
        if [ -f "RoadRescue.apk" ]; then
          cp RoadRescue.apk gh-pages-dist/
        fi
        
        # 3. Copy QA Reports into /reports/ and /reports/latest/
        cp -r "Test Results/HTML/"* gh-pages-dist/reports/latest/ || true
        cp -r "Test Results/Excel/"* gh-pages-dist/reports/latest/ || true
        cp -r "Test Results/JSON/"* gh-pages-dist/reports/latest/ || true
        cp "Test Results/Summary/consolidated-summary.md" gh-pages-dist/reports/latest/ || true
        
        cp -r gh-pages-dist/reports/latest/* gh-pages-dist/reports/ || true

        # Generate Reports Portal index.html at /reports/index.html
        cat << 'EOF' > gh-pages-dist/reports/index.html
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>RoadRescue Automation & Quality Reports Portal</title>
          <style>
            :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --accent: #58a6ff; --text: #c9d1d9; --gold: #f2c94c; }
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 40px; margin: 0; display: flex; flex-direction: column; align-items: center; }
            .container { max-width: 800px; width: 100%; }
            h1 { color: #fff; margin-bottom: 8px; text-align: center; }
            p.subtitle { color: #8b949e; text-align: center; margin-bottom: 32px; }
            .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
            .report-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-decoration: none; color: inherit; transition: transform 0.2s, border-color 0.2s; display: block; }
            .report-card:hover { transform: translateY(-4px); border-color: var(--accent); }
            .report-card h3 { color: var(--accent); margin: 0 0 8px 0; }
            .report-card p { color: #8b949e; font-size: 0.95rem; margin: 0; }
            .tag { display: inline-block; background: rgba(88, 166, 255, 0.15); color: var(--accent); padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-top: 12px; }
            .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-weight: 600; }
          </style>
        </head>
        <body>
          <div class="container">
            <a href="../" class="back-link">← Launch RoadRescue Web App</a>
            <h1>🚀 RoadRescue Quality & Automation Portal</h1>
            <p class="subtitle">Official Test Execution Evidence & Executive Dashboard</p>
            <div class="card-grid">
              <a href="consolidated-report.html" class="report-card">
                <h3>📊 Consolidated Quality Report</h3>
                <p>Executive quality dashboard, domain breakdowns (Selenium, Appium, Security, Load), and SLA indicators.</p>
                <span class="tag">Executive Summary</span>
              </a>
              <a href="dashboard.html" class="report-card">
                <h3>📈 Interactive Dashboard</h3>
                <p>Real-time metric breakdown, status distribution, and execution analytics.</p>
                <span class="tag">Metrics Dashboard</span>
              </a>
              <a href="execution-report.html" class="report-card">
                <h3>📋 Detailed Execution Report</h3>
                <p>Filterable test execution table detailing all test cases, status badges, and duration.</p>
                <span class="tag">Detailed Results</span>
              </a>
              <a href="trends.html" class="report-card">
                <h3>📉 Execution Trends</h3>
                <p>Historical pass/fail trend analysis across automated build runs.</p>
                <span class="tag">Trend Analysis</span>
              </a>
            </div>
          </div>
        </body>
        </html>
        EOF
        
        cp -r gh-pages-dist/reports/latest/* gh-pages-dist/reports/history/build-${{ github.run_number }}/ || true

    - name: Deploy Payload to GitHub Pages Branch
      if: always() && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages-dist
        keep_files: false

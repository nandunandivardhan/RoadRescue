name: Appium Mobile E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  appium:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js 22 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Appium and UiAutomator2 Driver
      run: |
        npm install -g appium
        appium driver install uiautomator2
        appium --version

    - name: Start Appium Server
      run: |
        nohup appium --log appium-server.log > /dev/null 2>&1 &
        echo $! > appium.pid
        echo "Started Appium server PID: $(cat appium.pid)"
        sleep 5

    - name: Verify Appium Server
      run: |
        for i in $(seq 1 10); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4723/status 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Appium server is ready (HTTP 200)"
            curl -s http://127.0.0.1:4723/status | head -c 500
            echo ""
            break
          fi
          echo "Attempt $i: HTTP $STATUS - waiting..."
          sleep 2
        done

    - name: Install Appium test dependencies
      run: |
        cd tests/appium
        npm install

    - name: Run Appium Tests
      run: |
        cd tests/appium
        node appTest.js

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: appium-test-reports
        path: |
          tests/appium/appium-report.html
          tests/appium/appium-report.md
        if-no-files-found: warn

    - name: Upload Appium Server Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: appium-server-logs
        path: appium-server.log
        if-no-files-found: warn
